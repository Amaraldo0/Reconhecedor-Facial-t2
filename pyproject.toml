[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "facerec-ufms"
version = "1.0.0"
description = "Sistema acadêmico de reconhecimento facial com privacidade por padrão"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"facerec.app" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: exige modelo real e pesos baixados"]
addopts = "-m 'not slow'"
