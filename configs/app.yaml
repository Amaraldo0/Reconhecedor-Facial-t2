# Configuração da aplicação. Valores de modelo e threshold vêm da Parte 1 (ver ADR-001 e ADR-003).
server:
  host: 127.0.0.1
  port: 8000

model:
  id: facenet-vggface2-e05
  pretrained: vggface2     # vggface2 | casia-webface
  checkpoint: checkpoints/public/E05.pt  # relativo a FACEREC_HOME; null usa os pesos públicos (E01)
  device: auto             # auto | cuda | cpu

detection:
  min_confidence: 0.90
  image_size: 160
  margin: 14
  align: true

quality:
  min_face_px: 60
  min_confidence: 0.95
  min_sharpness: 15.0
  min_brightness: 40.0
  max_brightness: 225.0

recognition:
  threshold: 0.642         # ADR-003: validação, galeria de 20 pessoas, FAR-alvo de 0,1%
  aggregation: prototype   # max | prototype (ADR-001)

enrollment:
  max_images: 10
  consistency_threshold: 0.35

limits:
  max_upload_bytes: 10000000
  max_pixels: 25000000

storage:
  store_photos: false
